# MeTube: web interface for yt-dlp
# Based on "https://github.com/alexta69/metube"
# Start with: docker compose up -d
# Then open http://localhost:8081 in your browser.
# Downloads are saved to the "downloads" folder next to this file (change the path below if you like).

services:
    metube:
        image: ghcr.io/alexta69/metube
        container_name: metube
        ports:
            - 8081:8081
        volumes:
            - ./downloads:/downloads
        restart: unless-stopped
